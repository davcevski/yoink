name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release AND commit Formula/yoink.rb to this repo

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Default token has contents:write on this repo, which is all we need:
          # it publishes the release and pushes the Homebrew formula here. No PAT.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
